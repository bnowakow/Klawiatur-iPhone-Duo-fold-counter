services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: folding
      POSTGRES_USER: folding
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-folding-local-dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folding -d folding"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  supervisor:
    build: .
    env_file:
      - ./.env
    environment:
      PGHOST: db
      PGDATABASE: folding
      PGUSER: folding
      PGPASSWORD: ${POSTGRES_PASSWORD:-folding-local-dev}
      STREAM_URL: ${STREAM_URL:-https://www.youtube.com/watch?v=vaiHWiExDXg}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-4}
      BACKPRESSURE_MAX_INTERVAL_SECONDS: ${BACKPRESSURE_MAX_INTERVAL_SECONDS:-60}
      BACKPRESSURE_STABLE_SAMPLES: ${BACKPRESSURE_STABLE_SAMPLES:-12}
      EXPECTED_RATE_MIN: ${EXPECTED_RATE_MIN:-0.4916666666666667}
      EXPECTED_RATE_MAX: ${EXPECTED_RATE_MAX:-0.945}
      MAX_RATE: ${MAX_RATE:-5}
      RATE_TOLERANCE: ${RATE_TOLERANCE:-0.5}
      COUNTER_SLACK: ${COUNTER_SLACK:-5}
      REBASE_AFTER_SECONDS: ${REBASE_AFTER_SECONDS:-600}
      CLOTHING_ROI: ${CLOTHING_ROI:-0.48,0.51,0.65,0.62}
      CLOTHING_THRESHOLD: ${CLOTHING_THRESHOLD:-0.45}
      HANDOVER_CONFIRM_SECONDS: ${HANDOVER_CONFIRM_SECONDS:-60}
      NIGHT_STOP_START: ${NIGHT_STOP_START:-21:30}
      NIGHT_STOP_END: ${NIGHT_STOP_END:-06:30}
      NIGHT_STOP_IDLE_SECONDS: ${NIGHT_STOP_IDLE_SECONDS:-180}
      TIMEZONE: ${TIMEZONE:-Europe/Warsaw}
      ACTIVE_START: ${ACTIVE_START:-00:00}
      ACTIVE_END: ${ACTIVE_END:-00:00}
      IMAGE_STORAGE_LIMIT_BYTES: ${IMAGE_STORAGE_LIMIT_BYTES:-20000000000}
    volumes:
      - ./data:/data
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 100s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  ipduotest-pl:
    build: .
    env_file:
      - ./.env
    command: ["python", "ipduotest_pl.py"]
    environment:
      PGHOST: db
      PGDATABASE: folding
      PGUSER: folding
      PGPASSWORD: ${POSTGRES_PASSWORD:-folding-local-dev}
      IPDUOTEST_PL_INTERVAL_SECONDS: ${IPDUOTEST_PL_INTERVAL_SECONDS:-300}
      STREAM_URL: ${STREAM_URL:-https://www.youtube.com/watch?v=vaiHWiExDXg}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-4}
    volumes:
      - ./data:/data
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 100s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  vision:
    image: ollama/ollama:latest
    cpus: 2.0
    mem_limit: 6g
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - vision_models:/root/.ollama
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  vision-model:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://vision:11434
    command: ["pull", "${CLOTHING_DESCRIPTION_MODEL:-llava-phi3:3.8b}"]
    depends_on:
      vision:
        condition: service_started
    restart: on-failure
  clothing-descriptions:
    build: .
    env_file:
      - ./.env
    command: ["python", "clothing_descriptions.py"]
    volumes:
      - ./data:/data:ro
    environment:
      PGHOST: db
      PGDATABASE: folding
      PGUSER: folding
      PGPASSWORD: ${POSTGRES_PASSWORD:-folding-local-dev}
      STREAM_URL: ${STREAM_URL:-https://www.youtube.com/watch?v=vaiHWiExDXg}
      CLOTHING_DESCRIPTION_URL: http://vision:11434
      CLOTHING_DESCRIPTION_MODEL: ${CLOTHING_DESCRIPTION_MODEL:-llava-phi3:3.8b}
    depends_on:
      db:
        condition: service_healthy
      vision-model:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 300s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  youtube-chat:
    build: .
    profiles: [youtube]
    env_file:
      - ./.env
    command: ["python", "youtube_chat.py", "status"]
    environment:
      PGHOST: db
      PGDATABASE: folding
      PGUSER: folding
      PGPASSWORD: ${POSTGRES_PASSWORD:-folding-local-dev}
      YOUTUBE_AUTH_DIR: /secrets/youtube
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./secrets/youtube:/secrets/youtube
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: "no"

  youtube-bot:
    build: .
    profiles: [youtube]
    env_file:
      - ./.env
    command: ["python", "youtube_bot.py", "run"]
    environment:
      PGHOST: db
      PGDATABASE: folding
      PGUSER: folding
      PGPASSWORD: ${POSTGRES_PASSWORD:-folding-local-dev}
      YOUTUBE_AUTH_DIR: /secrets/youtube
      YOUTUBE_CHAT_ENABLED: "true"
    volumes:
      - ./secrets/youtube:/secrets/youtube
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "youtube_bot.py", "health"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  vision_models:
